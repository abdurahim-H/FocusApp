<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signing in… · Cosmic Focus</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #050308;
        color: #faf3e3;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center, rgba(255, 205, 115, 0.07) 0%, transparent 55%),
            radial-gradient(ellipse at center, rgba(10, 8, 4, 1) 0%, #050308 70%);
    }
    .wrap { text-align: center; padding: 24px; max-width: 420px; }
    .ring {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        border-radius: 50%;
        border: 2px solid rgba(255, 205, 115, 0.25);
        border-top-color: rgba(255, 205, 115, 0.95);
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
    }
    p { font-size: 13px; color: rgba(255, 246, 225, 0.6); margin: 0; line-height: 1.5; }
    a {
        display: inline-block;
        margin-top: 18px;
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 205, 115, 0.35);
        background: rgba(255, 205, 115, 0.08);
        color: #faf3e3;
        font-size: 13px;
        text-decoration: none;
    }
    a:hover {
        background: rgba(255, 205, 115, 0.16);
        border-color: rgba(255, 205, 115, 0.55);
    }
    .error .ring {
        border-color: rgba(255, 100, 100, 0.45);
        border-top-color: rgba(255, 100, 100, 0.45);
        border-left-color: rgba(255, 100, 100, 0.95);
        animation: none;
    }
</style>
</head>
<body>
<div class="wrap" id="wrap">
    <div class="ring"></div>
    <h1 id="title">Finishing sign-in…</h1>
    <p id="body">Returning you to Cosmic Focus.</p>
</div>
<script src="callback.js"></script>
</body>
</html>
