<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Focus - 3D Productivity Universe</title>
	<link rel="icon" type="image/svg+xml" href="assets/file_03.svg" />
    <link rel="preconnect" href="https://cdn.babylonjs.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.babylonjs.com">

    <!-- Core Styles -->
    <link rel="stylesheet" href="css/base/style.css?v=1763330417270.d90cfd8d09f3">
    <link rel="stylesheet" href="css/base/themes.css?v=1763330417270.d90cfd8d09f3">
    <link rel="stylesheet" href="css/components/components.css?v=phase1">
    <link rel="stylesheet" href="css/components/apple-liquid-glass.css?v=phase1">
    <link rel="stylesheet" href="css/base/responsive.css?v=1763375311264">
    
    <!-- Theme Initialization Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('fu_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            // Wait for body to exist
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.setAttribute('data-theme', savedTheme);
                });
            } else {
                // DOM already loaded
                document.body.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body data-theme="dark">
    <!-- Page start timer -->
    <script>window.__pageStart = performance.now(); console.log('⏱️ [0ms] Page body start');</script>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">Initializing Universe...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
    </div>

    <!-- 3D Scene Container -->
    <div id="scene-container"></div>

    <!-- Main Navigation -->
    <div class="nav-buttons">
        <button class="nav-btn active" data-mode="home">Home</button>
        <button class="nav-btn" data-mode="focus">Focus</button>
        <button class="nav-btn" data-mode="ambient">Ambient</button>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Home Mode -->
        <div class="mode active" id="home">
            <div class="home-content">
                <h1>Cosmic Focus</h1>
                <div class="greeting" id="greeting">Welcome to Your Universe!</div>
                <div class="date-time" id="dateTime"></div>
            </div>
        </div>

        <!-- Focus Mode - Pomodoro Timer and Tasks -->
        <div class="mode" id="focus">
            <div class="focus-content">
                <div class="session-info">
                    <h2 id="sessionType" class="session-type">Focus Time</h2>
                    <div class="session-progress">
                        Session <span id="pomodoroCount">1</span> of <span id="pomodoroTotal">4</span>
                    </div>
                </div>
                <div class="timer-display">25:00</div>
                
                <div class="timer-controls">
                    <button class="liquid-glass-btn liquid-glass-btn--primary liquid-glass-btn--lens-flare" id="startBtn">
                        <span class="btn-text">Start Focus</span>
                    </button>
                    <button class="liquid-glass-btn liquid-glass-btn--warning liquid-glass-btn--micro-reflect hidden" id="pauseBtn">
                        <span class="btn-text">Pause</span>
                    </button>
                    <button class="liquid-glass-btn liquid-glass-btn--starfield" id="resetBtn">
                        <span class="btn-text">Reset</span>
                    </button>
                    <button class="liquid-glass-btn liquid-glass-btn--success liquid-glass-btn--lens-flare hidden" id="skipBreakBtn">
                        <span class="btn-text">Skip Break</span>
                    </button>
                    <button class="liquid-glass-btn liquid-glass-btn--success liquid-glass-btn--lens-flare hidden" id="skipFocusBtn">
                        <span class="btn-text">Skip Focus</span>
                    </button>
                    <button class="liquid-glass-btn liquid-glass-btn--small liquid-glass-btn--micro-reflect" id="resetSessionBtn" title="Reset entire Pomodoro cycle">
                        <span class="btn-icon">⟳</span>
                    </button>
                </div>

                <!-- Task Management Section -->
                <div class="task-section">
                    <h3 class="tasks-title">Tasks for this session</h3>
                    <div class="task-input-group">
                        <input type="text" class="task-input" id="taskInput" placeholder="What are you working on?">
                        <button class="liquid-glass-btn liquid-glass-btn--success liquid-glass-btn--small liquid-glass-btn--lens-flare" id="addTaskBtn">
                            <span class="btn-text">Add</span>
                        </button>
                    </div>
                    <ul class="task-list" id="taskList"></ul>
                    <button class="clear-all-btn hidden" id="clearAllBtn" aria-label="Clear all tasks">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                            <path d="M2.5 4L6 7.5L9.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Clear All</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Ambient Mode - Relaxation and Sounds -->
        <div class="mode" id="ambient">
            <div class="ambient-content">
                <div class="ambient-section">
                    <h3 class="ambient-title">Ambient Sounds</h3>
                    
                    <!-- Active Sounds Display -->
                    <div class="active-sounds-container" id="activeSounds">
                        <!-- Active sound chips will be inserted here dynamically -->
                    </div>
                    
                    <!-- Browse Library Button -->
                    <button class="liquid-glass-btn browse-sounds-btn" id="browseSoundsBtn">
                        <span class="btn-icon">🎵</span>
                        <span class="btn-text">Browse Sound Library</span>
                    </button>
                </div>
                
                <!-- Sound Library Modal -->
                <div class="sound-library-modal" id="soundLibraryModal">
                    <div class="modal-backdrop"></div>
                    <div class="modal-container">
                        <!-- Modal Header -->
                        <div class="modal-header">
                            <h2 class="modal-title">Sound Library</h2>
                            <button class="modal-close-btn" id="closeModalBtn">
                                <span>✕</span>
                            </button>
                        </div>
                        
                        <!-- Search Bar -->
                        <div class="modal-search-container">
                            <input type="text" 
                                   class="modal-search-input" 
                                   id="modalSoundSearch" 
                                   placeholder="Search sounds..." 
                                   autocomplete="off"
                                   spellcheck="false">
                            <span class="modal-search-icon">🔍</span>
                        </div>
                        
                        <!-- Sound Grid -->
                        <div class="modal-content">
                            <!-- Nature Category -->
                            <div class="sound-category">
                                <h3 class="category-title">Nature</h3>
                                <div class="sound-grid">
                                    <button class="sound-card" data-sound="rain" data-sound-name="Rain" data-sound-tags="nature water weather">
                                        <span class="sound-icon">🌧️</span>
                                        <span class="sound-name">Rain</span>
                                    </button>
                                    <button class="sound-card" data-sound="ocean" data-sound-name="Ocean Waves" data-sound-tags="nature water sea beach">
                                        <span class="sound-icon">🌊</span>
                                        <span class="sound-name">Ocean Waves</span>
                                    </button>
                                    <button class="sound-card" data-sound="forest" data-sound-name="Forest" data-sound-tags="nature trees birds">
                                        <span class="sound-icon">🌲</span>
                                        <span class="sound-name">Forest</span>
                                    </button>
                                    <button class="sound-card" data-sound="thunder" data-sound-name="Thunder" data-sound-tags="nature storm weather">
                                        <span class="sound-icon">⚡</span>
                                        <span class="sound-name">Thunder</span>
                                    </button>
                                    <button class="sound-card" data-sound="wind" data-sound-name="Wind" data-sound-tags="nature weather breeze">
                                        <span class="sound-icon">💨</span>
                                        <span class="sound-name">Wind</span>
                                    </button>
                                    <button class="sound-card" data-sound="stream" data-sound-name="Stream" data-sound-tags="nature water river">
                                        <span class="sound-icon">💧</span>
                                        <span class="sound-name">Stream</span>
                                    </button>
                                    <button class="sound-card" data-sound="birds" data-sound-name="Birds" data-sound-tags="nature animals chirping">
                                        <span class="sound-icon">🐦</span>
                                        <span class="sound-name">Birds</span>
                                    </button>
                                    <button class="sound-card" data-sound="cricket" data-sound-name="Crickets" data-sound-tags="nature insects night">
                                        <span class="sound-icon">🦗</span>
                                        <span class="sound-name">Crickets</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Indoor Category -->
                            <div class="sound-category">
                                <h3 class="category-title">Indoor</h3>
                                <div class="sound-grid">
                                    <button class="sound-card" data-sound="fireplace" data-sound-name="Fireplace" data-sound-tags="indoor fire cozy warm">
                                        <span class="sound-icon">🔥</span>
                                        <span class="sound-name">Fireplace</span>
                                    </button>
                                    <button class="sound-card" data-sound="cafe" data-sound-name="Cafe" data-sound-tags="indoor people coffee social">
                                        <span class="sound-icon">☕</span>
                                        <span class="sound-name">Cafe</span>
                                    </button>
                                    <button class="sound-card" data-sound="library" data-sound-name="Library" data-sound-tags="indoor quiet study">
                                        <span class="sound-icon">📚</span>
                                        <span class="sound-name">Library</span>
                                    </button>
                                    <button class="sound-card" data-sound="fan" data-sound-name="Fan" data-sound-tags="indoor white noise">
                                        <span class="sound-icon">🌀</span>
                                        <span class="sound-name">Fan</span>
                                    </button>
                                    <button class="sound-card" data-sound="clock" data-sound-name="Clock Ticking" data-sound-tags="indoor time rhythmic">
                                        <span class="sound-icon">⏰</span>
                                        <span class="sound-name">Clock</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Urban Category -->
                            <div class="sound-category">
                                <h3 class="category-title">Urban</h3>
                                <div class="sound-grid">
                                    <button class="sound-card" data-sound="city" data-sound-name="City Traffic" data-sound-tags="urban cars street">
                                        <span class="sound-icon">🚗</span>
                                        <span class="sound-name">City Traffic</span>
                                    </button>
                                    <button class="sound-card" data-sound="train" data-sound-name="Train" data-sound-tags="urban travel transport">
                                        <span class="sound-icon">🚂</span>
                                        <span class="sound-name">Train</span>
                                    </button>
                                    <button class="sound-card" data-sound="subway" data-sound-name="Subway" data-sound-tags="urban metro underground">
                                        <span class="sound-icon">🚇</span>
                                        <span class="sound-name">Subway</span>
                                    </button>
                                    <button class="sound-card" data-sound="construction" data-sound-name="Construction" data-sound-tags="urban work building">
                                        <span class="sound-icon">🏗️</span>
                                        <span class="sound-name">Construction</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- White Noise Category -->
                            <div class="sound-category">
                                <h3 class="category-title">White Noise</h3>
                                <div class="sound-grid">
                                    <button class="sound-card" data-sound="whitenoise" data-sound-name="White Noise" data-sound-tags="noise sleep focus">
                                        <span class="sound-icon">📻</span>
                                        <span class="sound-name">White Noise</span>
                                    </button>
                                    <button class="sound-card" data-sound="pinknoise" data-sound-name="Pink Noise" data-sound-tags="noise sleep calm">
                                        <span class="sound-icon">🎙️</span>
                                        <span class="sound-name">Pink Noise</span>
                                    </button>
                                    <button class="sound-card" data-sound="brownnoise" data-sound-name="Brown Noise" data-sound-tags="noise deep focus">
                                        <span class="sound-icon">🎚️</span>
                                        <span class="sound-name">Brown Noise</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Musical Category -->
                            <div class="sound-category">
                                <h3 class="category-title">Musical</h3>
                                <div class="sound-grid">
                                    <button class="sound-card" data-sound="piano" data-sound-name="Piano" data-sound-tags="music instrument calm">
                                        <span class="sound-icon">🎹</span>
                                        <span class="sound-name">Piano</span>
                                    </button>
                                    <button class="sound-card" data-sound="guitar" data-sound-name="Guitar" data-sound-tags="music instrument acoustic">
                                        <span class="sound-icon">🎸</span>
                                        <span class="sound-name">Guitar</span>
                                    </button>
                                    <button class="sound-card" data-sound="chimes" data-sound-name="Wind Chimes" data-sound-tags="music meditation peaceful">
                                        <span class="sound-icon">🎐</span>
                                        <span class="sound-name">Wind Chimes</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Indicator -->
        <div class="progress-3d" id="progress3d" style="display: none;">
            <span class="progress-label">Universe Energy:</span>
            <span class="progress-value" id="progressValue">0%</span>
        </div>

    <!-- Babylon.js Core — the only required dependency -->
    <script>console.log('⏱️ [' + Math.round(performance.now() - window.__pageStart) + 'ms] Starting Babylon.js download...');</script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>console.log('⏱️ [' + Math.round(performance.now() - window.__pageStart) + 'ms] Babylon.js loaded');</script>

    <script type="module" src="js/core/app.js?v=phase1c"></script>
</body>
</html>
